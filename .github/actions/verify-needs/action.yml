name: Verify required jobs
description: 校验 needs 中的依赖是否全部成功或按预期跳过。
inputs:
  label:
    description: 聚合检查的分类名称，用于失败和成功提示。
    required: false
    default: ''
  needs-json:
    description: 调用方传入的 toJSON(needs) 结果。
    required: true
runs:
  using: composite
  steps:
    - name: Verify required jobs
      shell: bash
      env:
        NEEDS_JSON: ${{ inputs.needs-json }}
        CHECK_LABEL: ${{ inputs.label }}
      run: |
        python - <<'PY'
        import json
        import os
        import sys

        results = json.loads(os.environ['NEEDS_JSON'])
        label = os.environ.get('CHECK_LABEL', '')
        prefix = f'{label} ' if label else ''
        failed = {
            name: value.get('result')
            for name, value in results.items()
            if value.get('result') not in ('success', 'skipped')
        }
        if failed:
            print(f'Required {prefix}checks did not succeed:')
            for name, result in sorted(failed.items()):
                print(f'  {name}: {result}')
            sys.exit(1)
        print(f'All required {prefix}checks succeeded or were skipped.')
        PY
