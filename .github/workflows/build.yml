name: Build
on:
  push:
    branches: [ main, dev ]
    tags:
      - '*.*.*'
      - '*.*.*-*.*'
  pull_request:
    branches: [ main, dev ]

jobs:
  tests:
    uses: ./.github/workflows/test.yml

  build-windows-publish:
    needs: tests
    uses: ./.github/workflows/build-task-windows.yml
    strategy:
      fail-fast: false 
      matrix:
        include:
          - name: OlivOS-Win64-release
            enable: true
            runs-on: windows-latest
            python-version: '3.11.0'
            arch: amd64
            python-arch: x64
            freethreaded: false
            build-type: pyinstaller
            debug: false
          - name: OlivOS-Win-arm64-release
            enable: true
            runs-on: windows-11-arm
            python-version: '3.11'
            arch: arm64
            python-arch: arm64
            freethreaded: false
            build-type: pyinstaller
            debug: false
    with:
      name: ${{ matrix.name }}
      enable: ${{ matrix.enable }}
      runs-on: ${{ matrix.runs-on }}
      python-version: ${{ matrix.python-version }}
      arch: ${{ matrix.arch }}
      python-arch: ${{ matrix.python-arch }}
      freethreaded: ${{ matrix.freethreaded }}
      build-type: ${{ matrix.build-type }}
      debug: ${{ matrix.debug }}

  build-windows:
    needs: tests
    uses: ./.github/workflows/build-task-windows.yml
    strategy:
      fail-fast: false 
      matrix:
        include:
          - name: OlivOS-Win64-debug
            enable: true
            runs-on: windows-latest
            python-version: '3.11.0'
            arch: amd64
            python-arch: x64
            freethreaded: false
            build-type: pyinstaller
            debug: true

          - name: OlivOS-Win64-cpy311-release
            enable: true
            runs-on: windows-latest
            python-version: '3.11'
            arch: amd64
            python-arch: x64
            freethreaded: false
            build-type: pyinstaller
            debug: false

          - name: OlivOS-Win64-cpy311-debug
            enable: true
            runs-on: windows-latest
            python-version: '3.11'
            arch: amd64
            python-arch: x64
            freethreaded: false
            build-type: pyinstaller
            debug: true
          
          - name: OlivOS-Win64-cpy314-release
            enable: false
            runs-on: windows-latest
            python-version: '3.14'
            arch: amd64
            python-arch: x64
            freethreaded: true
            build-type: pyinstaller
            debug: false

          - name: OlivOS-Win64-cpy314-debug
            enable: false
            runs-on: windows-latest
            python-version: '3.14'
            arch: amd64
            python-arch: x64
            freethreaded: true
            build-type: pyinstaller
            debug: true

          - name: OlivOS-Win64-nuitka
            enable: true
            runs-on: windows-latest
            python-version: '3.11.0'
            arch: amd64
            python-arch: x64
            freethreaded: false
            build-type: nuitka
            debug: false

          - name: OlivOS-Win64-cpy311-nuitka
            enable: true
            runs-on: windows-latest
            python-version: '3.11'
            arch: amd64
            python-arch: x64
            freethreaded: false
            build-type: nuitka
            debug: false

          - name: OlivOS-Win64-cpy314-nuitka
            enable: false
            runs-on: windows-latest
            python-version: '3.14'
            arch: amd64
            python-arch: x64
            freethreaded: true
            build-type: nuitka
            debug: false

          - name: OlivOS-Win64-pack
            enable: true
            runs-on: windows-latest
            python-version: '3.11.0'
            arch: amd64
            python-arch: x64
            freethreaded: false
            build-type: pack
            debug: false

          - name: OlivOS-Win64-cpy311-pack
            enable: true
            runs-on: windows-latest
            python-version: '3.11'
            arch: amd64
            python-arch: x64
            freethreaded: false
            build-type: pack
            debug: false

          - name: OlivOS-Win64-pypy311-pack
            enable: false
            runs-on: windows-latest
            python-version: 'pypy3.11'
            arch: amd64
            python-arch: x64
            freethreaded: false
            build-type: pack
            debug: false
          
          - name: OlivOS-Win64-old-release
            enable: true
            runs-on: windows-latest
            python-version: '3.7.5'
            arch: amd64
            python-arch: x64
            freethreaded: false
            build-type: pyinstaller
            debug: false
          
          - name: OlivOS-Win64-old-debug
            enable: true
            runs-on: windows-latest
            python-version: '3.7.5'
            arch: amd64
            python-arch: x64
            freethreaded: false
            build-type: pyinstaller
            debug: true
          
          - name: OlivOS-Win32-old-release
            enable: true
            runs-on: windows-latest
            python-version: '3.7.5'
            arch: '386'
            python-arch: x86
            freethreaded: false
            build-type: pyinstaller
            debug: false
          
          - name: OlivOS-Win32-old-debug
            enable: true
            runs-on: windows-latest
            python-version: '3.7.5'
            arch: '386'
            python-arch: x86
            freethreaded: false
            build-type: pyinstaller
            debug: true
          
          - name: OlivOS-Win32-old-pack
            enable: true
            runs-on: windows-latest
            python-version: '3.7.5'
            arch: '386'
            python-arch: x86
            freethreaded: false
            build-type: pack
            debug: false
    with:
      name: ${{ matrix.name }}
      enable: ${{ matrix.enable }}
      runs-on: ${{ matrix.runs-on }}
      python-version: ${{ matrix.python-version }}
      arch: ${{ matrix.arch }}
      python-arch: ${{ matrix.python-arch }}
      freethreaded: ${{ matrix.freethreaded }}
      build-type: ${{ matrix.build-type }}
      debug: ${{ matrix.debug }}

  build-linux-publish:
    needs: tests
    uses: ./.github/workflows/build-task-linux.yml
    strategy:
      fail-fast: false 
      matrix:
        include:
          - name: OlivOS-Linux64-release
            enable: true
            runs-on: ubuntu-latest
            python-version: '3.10.8'
            arch: amd64
            python-arch: x64
            freethreaded: false
            build-type: pyinstaller
            debug: false

          # 公开仓库的 arm64 托管 runner 是免费的（4 vCPU），
          # x86 runner 上装 arm64 的 Python 跑不起来，必须换 arm64 runner。
          #
          # Python 用 3.11 而不是 amd64 那条的 3.10.8：gevent 26.9.0 只发布了
          # x86_64 的 cp310 轮子，aarch64 从 cp311 才开始，用 3.10 的话 arm64
          # 会退回 gevent 25.9.1，两个架构的依赖版本就对不上了。
          # 3.11 也是这里能用的上限：Pillow 被钉在 9.3.0，而它只发到 cp311
          # 的轮子，再往上（3.12/3.13）就得源码编译 Pillow。
          # 不写死补丁号，让 setup-python 取最新的 3.11.x。
          - name: OlivOS-Linux64-arm64-release
            enable: true
            runs-on: ubuntu-24.04-arm
            python-version: '3.11'
            arch: arm64
            python-arch: arm64
            freethreaded: false
            build-type: pyinstaller
            debug: false
    with:
      name: ${{ matrix.name }}
      enable: ${{ matrix.enable }}
      runs-on: ${{ matrix.runs-on }}
      python-version: ${{ matrix.python-version }}
      arch: ${{ matrix.arch }}
      python-arch: ${{ matrix.python-arch }}
      freethreaded: ${{ matrix.freethreaded }}
      build-type: ${{ matrix.build-type }}
      debug: ${{ matrix.debug }}

  build-linux:
    needs: tests
    uses: ./.github/workflows/build-task-linux.yml
    strategy:
      fail-fast: false 
      matrix:
        include:
          - name: OlivOS-Linux64-nuitka
            enable: true
            runs-on: ubuntu-latest
            python-version: '3.10.8'
            arch: amd64
            python-arch: x64
            freethreaded: false
            build-type: nuitka
            debug: false

          - name: OlivOS-Linux64-pack
            enable: true
            runs-on: ubuntu-latest
            python-version: '3.10.8'
            arch: amd64
            python-arch: x64
            freethreaded: false
            build-type: pack
            debug: false

          # 下面两条 arm64 的常驻任务保持关闭，arm64 的正式产物由
          # build-linux-publish 负责，开着会重复构建一遍。
          # runner 与 Python 版本都已经改成 arm64 那套，要手动跑直接开 enable。
          - name: OlivOS-Linux64-ARM64-release
            enable: false
            runs-on: ubuntu-24.04-arm
            python-version: '3.11'
            arch: arm64
            python-arch: arm64
            freethreaded: false
            build-type: pyinstaller
            debug: false

          - name: OlivOS-Linux64-ARM64-nuitka
            enable: false
            runs-on: ubuntu-24.04-arm
            python-version: '3.11'
            arch: arm64
            python-arch: arm64
            freethreaded: false
            build-type: nuitka
            debug: false
    with:
      name: ${{ matrix.name }}
      enable: ${{ matrix.enable }}
      runs-on: ${{ matrix.runs-on }}
      python-version: ${{ matrix.python-version }}
      arch: ${{ matrix.arch }}
      python-arch: ${{ matrix.python-arch }}
      freethreaded: ${{ matrix.freethreaded }}
      build-type: ${{ matrix.build-type }}
      debug: ${{ matrix.debug }}

  build-macos-publish:
    needs: tests
    uses: ./.github/workflows/build-task-macos.yml
    strategy:
      fail-fast: false 
      matrix:
        include:
          - name: OlivOS-MacOS64-release
            enable: true
            runs-on: macos-26-intel
            python-version: '3.11.0'
            arch: amd64
            python-arch: x64
            freethreaded: false
            build-type: pyinstaller
            debug: false
          - name: OlivOS-MacOS-arm64-release
            enable: true
            runs-on: macos-latest
            python-version: '3.11.0'
            arch: arm64
            python-arch: arm64
            freethreaded: false
            build-type: pyinstaller
            debug: false
    with:
      name: ${{ matrix.name }}
      enable: ${{ matrix.enable }}
      runs-on: ${{ matrix.runs-on }}
      python-version: ${{ matrix.python-version }}
      arch: ${{ matrix.arch }}
      python-arch: ${{ matrix.python-arch }}
      freethreaded: ${{ matrix.freethreaded }}
      build-type: ${{ matrix.build-type }}
      debug: ${{ matrix.debug }}

  build-macos:
    needs: tests
    uses: ./.github/workflows/build-task-macos.yml
    strategy:
      fail-fast: false 
      matrix:
        include:
          - name: OlivOS-MacOS64-nuitka
            enable: false
            runs-on: macos-26-intel
            python-version: '3.11.0'
            arch: amd64
            python-arch: x64
            freethreaded: false
            build-type: nuitka
            debug: false

          - name: OlivOS-MacOS64-pack
            enable: true
            runs-on: macos-26-intel
            python-version: '3.11.0'
            arch: amd64
            python-arch: x64
            freethreaded: false
            build-type: pack
            debug: false
          - name: OlivOS-MacOS-arm64-pack
            enable: true
            runs-on: macos-latest
            python-version: '3.11.0'
            arch: arm64
            python-arch: arm64
            freethreaded: false
            build-type: pack
            debug: false
    with:
      name: ${{ matrix.name }}
      enable: ${{ matrix.enable }}
      runs-on: ${{ matrix.runs-on }}
      python-version: ${{ matrix.python-version }}
      arch: ${{ matrix.arch }}
      python-arch: ${{ matrix.python-arch }}
      freethreaded: ${{ matrix.freethreaded }}
      build-type: ${{ matrix.build-type }}
      debug: ${{ matrix.debug }}

  release-draft:
    runs-on: ubuntu-latest
    if: github.ref_type == 'tag'
    needs:
      - build-windows-publish
      - build-linux-publish
    permissions:
      contents: write
    steps:
      - name: Download Windows Artifact
        uses: actions/download-artifact@v4
        with:
          name: OlivOS-Win
          path: OlivOS-Win/

      - name: Download Windows arm64 Artifact
        uses: actions/download-artifact@v4
        with:
          name: OlivOS-Win-arm64
          path: OlivOS-Win-arm64/
      
      - name: Download Linux Artifact
        uses: actions/download-artifact@v4
        with:
          name: OlivOS-Linux
          path: OlivOS-Linux/
      
      - name: Download Linux arm64 Artifact
        uses: actions/download-artifact@v4
        with:
          name: OlivOS-Linux-arm64
          path: OlivOS-Linux-arm64/
      
      - name: Packing Release
        run: |
          cd ./OlivOS-Win
          zip -r ../OlivOS-Win.zip ./
          cd ../
          cp ./OlivOS-Win.zip ./OlivOS-Win-${{ github.ref_name }}.zip

          cd ./OlivOS-Win-arm64
          zip -r ../OlivOS-Win-arm64.zip ./
          cd ../
          cp ./OlivOS-Win-arm64.zip ./OlivOS-Win-arm64-${{ github.ref_name }}.zip
          
          cd ./OlivOS-Linux
          zip -r ../OlivOS-Linux.zip ./
          cd ../
          cp ./OlivOS-Linux.zip ./OlivOS-Linux-${{ github.ref_name }}.zip
          
          cd ./OlivOS-Linux-arm64
          zip -r ../OlivOS-Linux-arm64.zip ./
          cd ../
          cp ./OlivOS-Linux-arm64.zip ./OlivOS-Linux-arm64-${{ github.ref_name }}.zip
          
          ls -R
      
      - name: Create Draft Release
        uses: ncipollo/release-action@v1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          tag: ${{ github.ref_name }}
          draft: true
          allowUpdates: true
          removeArtifacts: true
          artifacts: |
            ./OlivOS-Win.zip
            ./OlivOS-Win-${{ github.ref_name }}.zip
            ./OlivOS-Win-arm64.zip
            ./OlivOS-Win-arm64-${{ github.ref_name }}.zip
            ./OlivOS-Linux.zip
            ./OlivOS-Linux-${{ github.ref_name }}.zip
            ./OlivOS-Linux-arm64.zip
            ./OlivOS-Linux-arm64-${{ github.ref_name }}.zip
