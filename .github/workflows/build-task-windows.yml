name: Build Task Windows
on:
  workflow_call:
    inputs:
      name:
        required: true
        type: string
      enable:
        required: true
        type: boolean
        default: true
      runs-on:
        required: true
        type: string
      python-version:
        required: true
        type: string
      arch:
        required: true
        type: string
      python-arch:
        required: true
        type: string
      freethreaded:
        required: false
        type: boolean
        default: false
      build-type:
        required: true
        type: string
      debug: 
        required: false
        type: boolean
        default: false

jobs:
  build:
    if: inputs.enable && (inputs.runs-on == 'windows-latest' || inputs.runs-on == 'windows-11-arm')
    runs-on: ${{ inputs.runs-on }}
    # Nuitka 需要编译全部 site-packages，设置充足上限避免编译超时。
    timeout-minutes: 180
    defaults:
      run:
        shell: pwsh
    env:
      NUITKA_CACHE_DIR: ${{ github.workspace }}/.nuitka-cache
    steps:
    - uses: actions/checkout@v5

    - name: Install MSVC Build Tools
      if: false && inputs.build-type == 'nuitka'
      run: |
        choco install visualstudio2022buildtools -y --package-parameters "--add Microsoft.VisualStudio.Workload.VCTools --includeRecommended --includeOptional"
        echo "MSBUILD_PATH=C:\Program Files\Microsoft Visual Studio\2022\BuildTools\MSBuild\Current\Bin" >> $env:GITHUB_ENV
        echo "PATH=$MSBUILD_PATH;$env:PATH" >> $env:GITHUB_ENV

    - name: Setup Python ${{ inputs.python-version }} (${{ inputs.python-arch }})
      id: setup-python
      uses: actions/setup-python@v6
      with:
        python-version: ${{ inputs.python-version }}
        cache: pip
        architecture: ${{ inputs.python-arch }}
        freethreaded: ${{ inputs.freethreaded && true || false }}

    - name: Cache Nuitka build cache
      if: inputs.build-type == 'nuitka'
      uses: actions/cache@v6
      with:
        path: .nuitka-cache
        key: nuitka-${{ runner.os }}-${{ inputs.python-version }}-${{ inputs.python-arch }}-${{ hashFiles('pyproject.toml', 'setup.py', 'tools/build/nuitka_build.py') }}
        restore-keys: |
          nuitka-${{ runner.os }}-${{ inputs.python-version }}-${{ inputs.python-arch }}-
    
    - name: Build by ${{ inputs.build-type }} (${{ inputs.debug && 'Debug' || 'Release' }})
      id: build
      run: |
        $PYTHON_EXE = "${{ steps.setup-python.outputs.python-path }}"
        $PYTHON_ROOT = Split-Path -Parent $PYTHON_EXE
        echo "Python root directory: ${PYTHON_ROOT}"
        mkdir -p ./python
        cp -r "${PYTHON_ROOT}/*" ./python/
        $PYTHON = "${{ github.workspace }}/python/python.exe"
        echo "PYTHON=$PYTHON" >> $GITHUB_OUTPUT
        & $PYTHON -m pip install --upgrade pip
        & $PYTHON ./tools/build/embed_webui.py
        & $PYTHON -m pip install .[${{ inputs.python-version == '3.7.5' && 'py37,' || '' }}${{ inputs.python-version == 'pypy3.11' && 'pypy,pypywin' || 'win' }},extend,${{ inputs.build-type }}]
        cp ./OlivOS/hook.py ./OlivOS/hook_bak.py
        if (${{ inputs.build-type == 'pyinstaller' && '1' || '0' }}) {
          if (${{ inputs.debug && '1' || '0' }}) {
            cp ./OlivOS/hook_pack_debug.py ./OlivOS/hook.py
            $env:OLIVOS_DEBUG = "1"
          } else {
            cp ./OlivOS/hook_pack.py ./OlivOS/hook.py
          }
          & $PYTHON -m PyInstaller ./OlivOS.spec
        } elseif (${{ inputs.build-type == 'nuitka' && '1' || '0' }}) {
          cp ./OlivOS/hook_pack_debug.py ./OlivOS/hook.py
          $env:OLIVOS_NUITKA_JOBS = $env:NUMBER_OF_PROCESSORS
          & $PYTHON ./tools/build/nuitka_build.py
        }
        mkdir OlivOS-PKG
        if (${{ inputs.build-type == 'pack' && '1' || '0' }}) {
          cp -r ./OlivOS ./OlivOS-PKG/
          cp -r ./python ./OlivOS-PKG/
          cp ./main.py ./OlivOS-PKG/
          cp ./script/run.bat ./OlivOS-PKG/
        } else {
          if (${{ inputs.debug && '1' || '0' }}) {
            cp ./dist/OlivOS.exe ./OlivOS-PKG/OlivOS_debug.exe
          } else {
            cp ./dist/OlivOS.exe ./OlivOS-PKG/OlivOS.exe
          }
        }
    
    - name: Upload Nuitka compilation report
      if: always() && inputs.build-type == 'nuitka'
      uses: actions/upload-artifact@v6
      with:
        name: nuitka-report-${{ inputs.name }}
        path: ./nuitka-report.xml
        if-no-files-found: warn

    - name: Upload Artifact
      uses: actions/upload-artifact@v6
      with:
        name: ${{ inputs.name }}
        path: ./OlivOS-PKG

    - name: Upload Publish Artifact
      uses: actions/upload-artifact@v6
      if: inputs.name == 'OlivOS-Win64-release' || inputs.name == 'OlivOS-Win-arm64-release'
      with:
        name: ${{ inputs.arch == 'arm64' && 'OlivOS-Win-arm64' || 'OlivOS-Win' }}
        path: ./OlivOS-PKG
