name: Build Task Linux
on:
  workflow_call:
    inputs:
      name:
        required: true
        type: string
      enable:
        required: true
        type: boolean
        default: true
      runs-on:
        required: true
        type: string
      python-version:
        required: true
        type: string
      arch:
        required: true
        type: string
      python-arch:
        required: true
        type: string
      freethreaded:
        required: false
        type: boolean
        default: false
      build-type:
        required: true
        type: string
      debug: 
        required: false
        type: boolean
        default: false

jobs:
  build:
    # 原来是写死的 inputs.runs-on == 'ubuntu-latest'，arm64 任务换成
    # ubuntu-24.04-arm 之后这个条件会直接变 false，job 被静默跳过。
    if: inputs.enable && startsWith(inputs.runs-on, 'ubuntu-')
    runs-on: ${{ inputs.runs-on }}
    # Nuitka 需要编译全部 site-packages，设置充足上限避免编译超时。
    timeout-minutes: 180
    # container:
    #   image: node:20-alpine
    #   options: --platform linux/${{ inputs.arch }}
    defaults:
      run:
        shell: bash
    env:
      NUITKA_CACHE_DIR: ${{ github.workspace }}/.nuitka-cache
    steps:
    - uses: actions/checkout@v5
    
    - name: Setup Python ${{ inputs.python-version }} (${{ inputs.python-arch }})
      id: setup-python
      uses: actions/setup-python@v6
      with:
        python-version: ${{ inputs.python-version }}
        cache: pip
        architecture: ${{ inputs.python-arch }}
        freethreaded: ${{ inputs.freethreaded && true || false }}

    - name: Cache Nuitka build cache
      if: inputs.build-type == 'nuitka'
      uses: actions/cache@v6
      with:
        path: .nuitka-cache
        key: nuitka-${{ runner.os }}-${{ inputs.python-version }}-${{ inputs.python-arch }}-${{ hashFiles('pyproject.toml', 'setup.py', 'tools/build/nuitka_build.py') }}
        restore-keys: |
          nuitka-${{ runner.os }}-${{ inputs.python-version }}-${{ inputs.python-arch }}-
    
    - name: Build by ${{ inputs.build-type }} (${{ inputs.debug && 'Debug' || 'Release' }})
      id: build
      run: |
        PYTHON_EXE="${{ steps.setup-python.outputs.python-path }}"
        PYTHON_ROOT="$(dirname "$(dirname "$PYTHON_EXE")")"
        echo "Python root directory: ${PYTHON_ROOT}"
        mkdir -p ./python
        cp -r "${PYTHON_ROOT}"/* ./python/
        chmod +x ./python/bin/python*
        PYTHON="${{ github.workspace }}/python/bin/python"
        echo "PYTHON=${PYTHON}" >> $GITHUB_OUTPUT
        "${PYTHON}" -m pip install --upgrade pip
        "${PYTHON}" ./tools/build/embed_webui.py
        "${PYTHON}" -m pip install .[extend,${{ inputs.build-type }}${{ inputs.python-version == 'pypy3.11' && ',pypy' || '' }}]
        cp ./OlivOS/hook.py ./OlivOS/hook_bak.py
        cp ./OlivOS/hook_pack_debug.py ./OlivOS/hook.py
        if [[ ${{ inputs.build-type == 'pyinstaller' && '1' || '0' }} -eq 1 ]]; then
          "${PYTHON}" -m PyInstaller ./OlivOS.spec
          # 启动冒烟：打包产物在 bootloader / 运行时钩子阶段就崩溃时（如缺 jaraco），构建直接判失败
          mkdir -p ./smoke && cp ./dist/OlivOS ./smoke/
          (cd ./smoke && timeout -k 5 30 ./OlivOS > ../smoke.log 2>&1 || true)
          if grep -q "Failed to execute script 'pyi_rth_" ./smoke.log; then
            cat ./smoke.log
            exit 1
          fi
          rm -rf ./smoke ./smoke.log
        elif [[ ${{ inputs.build-type == 'nuitka' && '1' || '0' }} -eq 1 ]]; then
          # 托管运行器内存有限；降低并行编译并启用低内存模式，避免大型模块编译时 OOM。
          export OLIVOS_NUITKA_JOBS="${OLIVOS_NUITKA_JOBS:-2}"
          export OLIVOS_NUITKA_LOW_MEMORY="${OLIVOS_NUITKA_LOW_MEMORY:-1}"
          "${PYTHON}" ./tools/build/nuitka_build.py
        fi
        mkdir OlivOS-PKG
        if [[ ${{ inputs.build-type == 'pack' && '1' || '0' }} -eq 1 ]]; then
          cp -r ./OlivOS ./OlivOS-PKG/
          cp -r ./python ./OlivOS-PKG/
          cp ./main.py ./OlivOS-PKG/
          cp ./script/run.sh ./OlivOS-PKG/
        else
          cp ./dist/OlivOS* ./OlivOS-PKG/
        fi
    
    - name: Upload Nuitka compilation report
      if: always() && inputs.build-type == 'nuitka'
      uses: actions/upload-artifact@v6
      with:
        name: nuitka-report-${{ inputs.name }}
        path: ./nuitka-report.xml
        if-no-files-found: warn

    - name: Upload Artifact
      uses: actions/upload-artifact@v6
      with:
        name: ${{ inputs.name }}
        path: ./OlivOS-PKG
    
    - name: Upload Publish Artifact
      uses: actions/upload-artifact@v6
      if: inputs.name == 'OlivOS-Linux64-release' || inputs.name == 'OlivOS-Linux64-arm64-release'
      with:
        # arm64 用单独的 artifact 名，release-draft 那边按名字分别下载
        name: ${{ inputs.arch == 'arm64' && 'OlivOS-Linux-arm64' || 'OlivOS-Linux' }}
        path: ./OlivOS-PKG
