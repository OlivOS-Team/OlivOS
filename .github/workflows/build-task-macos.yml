name: Build Task MacOS
on:
  workflow_call:
    inputs:
      name:
        required: true
        type: string
      enable:
        required: true
        type: boolean
        default: true
      runs-on:
        required: true
        type: string
      python-version:
        required: true
        type: string
      arch:
        required: true
        type: string
      python-arch:
        required: true
        type: string
      freethreaded:
        required: false
        type: boolean
        default: false
      build-type:
        required: true
        type: string
      debug: 
        required: false
        type: boolean
        default: false

jobs:
  build:
    if: inputs.enable && (inputs.runs-on == 'macos-latest' || inputs.runs-on == 'macos-26-intel')
    runs-on: ${{ inputs.runs-on }}
    # Nuitka 需要编译全部 site-packages，设置充足上限避免编译超时。
    timeout-minutes: 180
    defaults:
      run:
        shell: bash
    env:
      NUITKA_CACHE_DIR: ${{ github.workspace }}/.nuitka-cache
    steps:
    - uses: actions/checkout@v5
    
    - name: Setup Python ${{ inputs.python-version }} (${{ inputs.python-arch }})
      id: setup-python
      uses: actions/setup-python@v6
      with:
        python-version: ${{ inputs.python-version }}
        cache: pip
        architecture: ${{ inputs.python-arch }}
        freethreaded: ${{ inputs.freethreaded && true || false }}

    - name: Cache Nuitka build cache
      if: inputs.build-type == 'nuitka'
      uses: actions/cache@v6
      with:
        path: .nuitka-cache
        key: nuitka-${{ runner.os }}-${{ inputs.python-version }}-${{ inputs.python-arch }}-${{ hashFiles('pyproject.toml', 'setup.py', 'script/nuitka_build.py') }}
        restore-keys: |
          nuitka-${{ runner.os }}-${{ inputs.python-version }}-${{ inputs.python-arch }}-
    
    - name: Build by ${{ inputs.build-type }} (${{ inputs.debug && 'Debug' || 'Release' }})
      id: build
      run: |
        expected=${{ inputs.arch == 'arm64' && 'arm64' || 'x86_64' }}
        actual=$(uname -m)
        if [[ $actual != $expected ]]; then
          echo macOS构建架构不匹配：预期$expected，实际$actual >&2
          exit 1
        fi
        PYTHON_EXE="${{ steps.setup-python.outputs.python-path }}"
        PYTHON_ROOT="$(dirname "$(dirname "$PYTHON_EXE")")"
        echo "Python root directory: ${PYTHON_ROOT}"
        mkdir ./python
        cp -r "${PYTHON_ROOT}"/* ./python/
        chmod +x ./python/bin/python*
        PYTHON="${{ github.workspace }}/python/bin/python"
        echo "PYTHON=${PYTHON}" >> $GITHUB_OUTPUT
        "${PYTHON}" -m pip install --upgrade pip
        "${PYTHON}" ./script/embed_webui.py
        "${PYTHON}" -m pip install .[extend,${{ inputs.build-type }}${{ inputs.python-version == 'pypy3.11' && ',pypy' || '' }}]
        cp ./OlivOS/hook.py ./OlivOS/hook_bak.py
        cp ./OlivOS/hook_pack_debug.py ./OlivOS/hook.py
        if [[ ${{ inputs.build-type == 'pyinstaller' && '1' || '0' }} -eq 1 ]]; then
          "${PYTHON}" -m PyInstaller ./OlivOS.spec
        elif [[ ${{ inputs.build-type == 'nuitka' && '1' || '0' }} -eq 1 ]]; then
          export OLIVOS_NUITKA_JOBS=$(getconf _NPROCESSORS_ONLN)
          "${PYTHON}" ./script/nuitka_build.py
        fi
        mkdir OlivOS-PKG
        if [[ ${{ inputs.build-type == 'pack' && '1' || '0' }} -eq 1 ]]; then
          cp -r ./OlivOS ./OlivOS-PKG/
          cp -r ./python ./OlivOS-PKG/
          cp ./main.py ./OlivOS-PKG/
          cp ./script/run.sh ./OlivOS-PKG/
        else
          cp ./dist/OlivOS* ./OlivOS-PKG/
        fi
    
    - name: Upload Nuitka compilation report
      if: always() && inputs.build-type == 'nuitka'
      uses: actions/upload-artifact@v6
      with:
        name: nuitka-report-${{ inputs.name }}
        path: ./nuitka-report.xml
        if-no-files-found: warn

    - name: Upload Artifact
      uses: actions/upload-artifact@v6
      with:
        name: ${{ inputs.name }}
        path: ./OlivOS-PKG
    
    - name: Upload Publish Artifact
      uses: actions/upload-artifact@v6
      if: inputs.name == 'OlivOS-MacOS64-release' || inputs.name == 'OlivOS-MacOS-arm64-release'
      with:
        name: ${{ inputs.arch == 'arm64' && 'OlivOS-MacOS-arm64' || 'OlivOS-MacOS' }}
        path: ./OlivOS-PKG
