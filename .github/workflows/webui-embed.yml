name: Embed WebUI

on:
  push:
    branches: [ main, dev ]
    paths:
      - 'OlivOS/webUI/static/**'
      - 'script/embed_webui.py'
      - '.github/workflows/webui-embed.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: embed-webui-${{ github.ref }}
  cancel-in-progress: false

jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Regenerate staticData.py
        run: python ./script/embed_webui.py
      - name: Commit regenerated staticData.py
        run: |
          if ! git diff --quiet -- OlivOS/webUI/staticData.py; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add OlivOS/webUI/staticData.py
            git commit -m 'chore(webUI): 合并后自动重新生成 staticData.py [skip ci]'
            git push origin HEAD:${{ github.ref_name }}
          fi
